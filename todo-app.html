<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List App</title>
  <style>
    :root{--ink:#12302f;--paper:#f2f5f1;--line:#d3dcd6;--accent:#e8a33d;--muted:#52676a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:start center;padding:2rem 1rem;background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
    .app{width:100%;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.5rem}
    h1{margin:0 0 1rem;font-size:1.7rem}
    form{display:flex;gap:.5rem}
    input[type=text]{flex:1;padding:.7rem .9rem;border:1.5px solid var(--ink);border-radius:10px;font:inherit}
    button{font:inherit;cursor:pointer}
    .add{padding:.7rem 1.1rem;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:600}
    .add:hover{background:#0e2524}
    .filters{display:flex;gap:.4rem;margin:1rem 0}
    .filters button{padding:.3rem .9rem;border:1.5px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink)}
    .filters button.on{background:var(--accent);font-weight:600}
    ul{list-style:none;margin:0;padding:0}
    li{display:flex;align-items:center;gap:.7rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
    li span{flex:1;word-break:break-word}
    li.done span{text-decoration:line-through;color:var(--muted)}
    li input{width:1.2rem;height:1.2rem;accent-color:var(--ink)}
    .del{border:0;background:none;color:#b3261e;font-weight:600}
    .del:hover{text-decoration:underline}
    .foot{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;color:var(--muted);font-size:.95rem}
    .clear{border:0;background:none;color:var(--ink);text-decoration:underline}
    .empty{color:var(--muted);padding:1rem 0}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  </style>
</head>
<body>
  <main class="app">
    <h1>My Tasks</h1>
    <form id="form">
      <label for="text" hidden>New task</label>
      <input id="text" type="text" placeholder="Add a task" autocomplete="off" required>
      <button class="add" type="submit">Add task</button>
    </form>
    <div class="filters" id="filters">
      <button class="on" data-f="all">All</button>
      <button data-f="active">Active</button>
      <button data-f="done">Done</button>
    </div>
    <ul id="list"></ul>
    <div class="foot">
      <span id="count"></span>
      <button class="clear" id="clear">Clear completed</button>
    </div>
  </main>

  <script>
    const KEY = 'todo-tasks';
    let tasks = [];
    try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { tasks = []; }
    let filter = 'all';

    const list = document.getElementById('list');
    const count = document.getElementById('count');

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
    }

    function render() {
      list.innerHTML = '';
      const shown = tasks.filter(t =>
        filter === 'all' || (filter === 'done' ? t.done : !t.done));

      if (!shown.length) {
        const p = document.createElement('li');
        p.className = 'empty';
        p.textContent = 'No tasks here. Add one above.';
        list.appendChild(p);
      }

      shown.forEach(t => {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';

        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = t.done;
        box.setAttribute('aria-label', 'Mark "' + t.text + '" as done');
        box.addEventListener('change', () => { t.done = box.checked; save(); render(); });

        const label = document.createElement('span');
        label.textContent = t.text;

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'Delete';
        del.addEventListener('click', () => {
          tasks = tasks.filter(x => x.id !== t.id); save(); render();
        });

        li.append(box, label, del);
        list.appendChild(li);
      });

      const left = tasks.filter(t => !t.done).length;
      count.textContent = left + (left === 1 ? ' task left' : ' tasks left');
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('text');
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now(), text: text, done: false });
      input.value = '';
      save(); render();
    });

    document.getElementById('filters').addEventListener('click', e => {
      if (!e.target.dataset.f) return;
      filter = e.target.dataset.f;
      document.querySelectorAll('#filters button').forEach(b =>
        b.classList.toggle('on', b === e.target));
      render();
    });

    document.getElementById('clear').addEventListener('click', () => {
      tasks = tasks.filter(t => !t.done); save(); render();
    });

    render();
  </script>
</body>
</html>
