<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git and GitHub Quiz</title>
  <style>
    :root{--ink:#12302f;--paper:#f2f5f1;--line:#d3dcd6;--accent:#e8a33d;--muted:#52676a;--ok:#1b7a43;--bad:#b3261e}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:start center;padding:2rem 1rem;background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
    .quiz{width:100%;max-width:560px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.5rem}
    h1{margin:0 0 .3rem;font-size:1.6rem}
    .meta{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:.6rem}
    .bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:1.2rem}
    .bar div{height:100%;width:0;background:var(--ink);transition:width .4s}
    h2{font-size:1.2rem;margin:0 0 1rem}
    .opts{display:grid;gap:.6rem}
    .opt{text-align:left;padding:.75rem 1rem;border:1.5px solid var(--ink);border-radius:10px;background:#fff;font:inherit;color:var(--ink);cursor:pointer}
    .opt:hover:not(:disabled){background:var(--paper)}
    .opt.right{background:#d9f0e2;border-color:var(--ok)}
    .opt.wrong{background:#f8d9d6;border-color:var(--bad)}
    .opt:disabled{cursor:default}
    .next{margin-top:1.2rem;padding:.7rem 1.4rem;border:0;border-radius:999px;background:var(--ink);color:#fff;font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer}
    .next:hover{background:#0e2524}
    .fb{min-height:1.5em;margin-top:.8rem;font-weight:600}
    .score{font-size:3rem;font-weight:800;margin:.5rem 0}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="quiz">
    <h1>Git and GitHub Quiz</h1>

    <section id="game">
      <div class="meta"><span id="qnum"></span><span id="score"></span></div>
      <div class="bar"><div id="progress"></div></div>
      <h2 id="question"></h2>
      <div class="opts" id="opts"></div>
      <p class="fb" id="fb" role="status" aria-live="polite"></p>
      <button class="next" id="next" hidden>Next question</button>
    </section>

    <section id="result" hidden>
      <p>You scored</p>
      <p class="score" id="final"></p>
      <p id="msg"></p>
      <button class="next" id="again">Play again</button>
    </section>
  </main>

  <script>
    const QUESTIONS = [
      { q: 'Which command creates a new, empty Git repository?', a: ['git start', 'git init', 'git new', 'git create'], c: 1 },
      { q: 'Which command stages all changed files for the next commit?', a: ['git add .', 'git push .', 'git stage --all-files', 'git commit .'], c: 0 },
      { q: 'What does git clone do?', a: ['Deletes a repository', 'Copies a remote repository to your computer', 'Merges two branches', 'Shows commit history'], c: 1 },
      { q: 'Which command uploads your local commits to GitHub?', a: ['git pull', 'git fetch', 'git push', 'git status'], c: 2 },
      { q: 'What is GitHub Pages used for?', a: ['Hosting a free static website from a repository', 'Writing documents online', 'Scanning code for viruses', 'Managing email'], c: 0 },
      { q: 'Which command shows the commit history?', a: ['git log', 'git history', 'git show-all', 'git list'], c: 0 },
      { q: 'What is a branch in Git?', a: ['A backup folder', 'A separate line of development', 'A type of commit message', 'A remote server'], c: 1 }
    ];

    let i = 0, score = 0, locked = false;
    const $ = id => document.getElementById(id);

    function show() {
      locked = false;
      const item = QUESTIONS[i];
      $('qnum').textContent = 'Question ' + (i + 1) + ' of ' + QUESTIONS.length;
      $('score').textContent = 'Score: ' + score;
      $('progress').style.width = (i / QUESTIONS.length * 100) + '%';
      $('question').textContent = item.q;
      $('fb').textContent = '';
      $('next').hidden = true;
      $('opts').innerHTML = '';
      item.a.forEach((text, idx) => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.textContent = text;
        b.addEventListener('click', () => choose(idx));
        $('opts').appendChild(b);
      });
    }

    function choose(idx) {
      if (locked) return;
      locked = true;
      const item = QUESTIONS[i];
      const buttons = $('opts').children;
      for (let k = 0; k < buttons.length; k++) {
        buttons[k].disabled = true;
        if (k === item.c) buttons[k].classList.add('right');
      }
      if (idx === item.c) {
        score++;
        $('fb').textContent = 'Correct!';
        $('fb').style.color = 'var(--ok)';
      } else {
        buttons[idx].classList.add('wrong');
        $('fb').textContent = 'Not quite. The correct answer is highlighted.';
        $('fb').style.color = 'var(--bad)';
      }
      $('score').textContent = 'Score: ' + score;
      $('next').textContent = i === QUESTIONS.length - 1 ? 'See result' : 'Next question';
      $('next').hidden = false;
      $('next').focus();
    }

    $('next').addEventListener('click', () => {
      i++;
      if (i < QUESTIONS.length) { show(); return; }
      $('game').hidden = true;
      $('result').hidden = false;
      $('final').textContent = score + ' / ' + QUESTIONS.length;
      const pct = score / QUESTIONS.length;
      $('msg').textContent = pct === 1 ? 'Perfect score!' : pct >= 0.6 ? 'Good work. Try again for a perfect score.' : 'Keep practising and try again.';
    });

    $('again').addEventListener('click', () => {
      i = 0; score = 0;
      $('result').hidden = true;
      $('game').hidden = false;
      show();
    });

    show();
  </script>
</body>
</html>
